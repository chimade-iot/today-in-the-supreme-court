name: Build and publish the daily bulletin

on:
  schedule:
    # Cron here is UTC. These are 07:30 and 18:30 IST.
    - cron: "0 2 * * 1-6"
    - cron: "0 13 * * 1-6"
  workflow_dispatch:          # lets you build on demand from the Actions tab
    inputs:
      publish_episode:
        description: "Publish this build as a podcast episode"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "build_bulletin.py"
      - "sources.py"
      - "make_bed.py"
      - "podcast.py"
      - "podcast.json"
      - "index.html"

permissions:
  contents: write             # needed to create the episode release
  pages: write
  id-token: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Synthesise the music bed
        run: python3 make_bed.py

      - name: Report which sources are alive
        continue-on-error: true
        run: python3 build_bulletin.py --check-sources

      - name: Build the bulletin
        run: python3 build_bulletin.py --max-items 8

      - name: Show what was produced
        run: |
          ls -la public/
          python3 -c "import json;d=json.load(open('public/bulletin.json'));print(d['item_count'],'items,',d['duration'],'seconds, engine',d['engine'])"

      # --- podcast ------------------------------------------------------
      # Each edition is published as a GitHub Release: the assets are
      # permanent and free, so the release list becomes the episode
      # archive and the feed can always be regenerated from it.

      - name: Package the episode
        id: episode
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_episode }}
        run: python3 podcast.py episode

      - name: Publish the episode release
        if: ${{ steps.episode.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.episode.outputs.tag }}
          TITLE: ${{ steps.episode.outputs.title }}
          FILE: ${{ steps.episode.outputs.file }}
          NOTES: ${{ steps.episode.outputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running the same build should update the episode, not fail.
            echo "Release $TAG exists; updating it."
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "$TITLE" --notes-file "$NOTES"
          fi

      - name: Build the podcast feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 podcast.py feed
          python3 podcast.py check

      - name: Show the deployable site
        run: ls -la public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
